name: 6d-ttmt

# ── Named volumes ──────────────────────────────────────────────────────────
# Only Postgres needs persistent storage — ttmt-data/-scripts/-artifacts were
# for automation features (Reports email config, RF script/artifact storage)
# that aren't wired to any active route in this manual-testing-only build.
volumes:
  ttmt-pgdata:

# ── Services ───────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────
  ttmt-postgres:
    image: postgres:16-alpine
    container_name: ttmt-postgres
    restart: unless-stopped
    environment:
      - TZ=Asia/Kolkata
      - POSTGRES_DB=${POSTGRES_DB:-ttmt}
      - POSTGRES_USER=${POSTGRES_USER:-ttmt}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ttmt-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-ttmt}", "-d", "${POSTGRES_DB:-ttmt}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - ttmt-net

  # ── Redis ────────────────────────────────────────────────────────────────
  ttmt-redis:
    image: redis:7-alpine
    container_name: ttmt-redis
    restart: unless-stopped
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then redis-server --requirepass "$$REDIS_PASSWORD"; else redis-server; fi'
    environment:
      - TZ=Asia/Kolkata
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      test: >
        sh -c 'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - ttmt-net

  # ── API ──────────────────────────────────────────────────────────────────
  ttmt-api:
    build:
      context: .
      dockerfile: packages/api/Dockerfile
    image: ttmt-api:latest
    container_name: ttmt-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:4000"
    env_file:
      - .env
    environment:
      - TZ=Asia/Kolkata
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=4000
      - REDIS_URL=redis://:${REDIS_PASSWORD:-}@ttmt-redis:6379
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ttmt}:${POSTGRES_PASSWORD}@ttmt-postgres:5432/${POSTGRES_DB:-ttmt}
      - CORS_ORIGIN=http://localhost:3200
      - RUNNER_URL=http://ttmt-runner:5001
      - RUNNER_PRIMARY_URL=http://ttmt-runner:5001
      - RUNNER_REPLICAS=${RUNNER_REPLICAS:-1}
      - RUNNER_CONCURRENCY=${RUNNER_CONCURRENCY:-4}
    depends_on:
      ttmt-redis:
        condition: service_healthy
      ttmt-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - ttmt-net

  # ── Runner ───────────────────────────────────────────────────────────────
  ttmt-runner:
    build:
      context: .
      dockerfile: packages/runner/Dockerfile
    image: ttmt-runner:latest
    container_name: ttmt-runner
    restart: unless-stopped
    environment:
      - TZ=Asia/Kolkata
      - API_URL=http://ttmt-api:4000
      - SE_AVOID_STATS=true
      - RUNNER_CONCURRENCY=${RUNNER_CONCURRENCY:-4}
    depends_on:
      ttmt-api:
        condition: service_healthy
    ports:
      - "${VNC_HOST:-127.0.0.1}:6280:6080"
    shm_size: '512m'
    extra_hosts:
      - "airtel6d-in-ventas-master-int-aavm-alpha-01.ocplab.6d.local:10.0.12.244"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 3g
        reservations:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - ttmt-net

  # ── UI ───────────────────────────────────────────────────────────────────
  ttmt-ui:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
    image: ttmt-ui:latest
    container_name: ttmt-ui
    restart: unless-stopped
    ports:
      - "0.0.0.0:3200:80"
    depends_on:
      ttmt-api:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      resources:
        limits:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - ttmt-net

# ── Network ────────────────────────────────────────────────────────────────
networks:
  ttmt-net:
    driver: bridge
