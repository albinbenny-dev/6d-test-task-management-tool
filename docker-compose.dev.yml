# Local development infrastructure only (Postgres + Redis for `pnpm dev`).
# Separate project name, container names, ports and volume from the main
# docker-compose.yml, so it never touches the ttmt-* stack. Started by
# scripts/dev.sh:  docker compose -f docker-compose.dev.yml up -d --wait
name: 6d-ttmt-dev

volumes:
  ttmt-dev-pgdata:

services:
  ttmt-dev-pg:
    image: postgres:16-alpine
    container_name: ttmt-dev-pg
    environment:
      - POSTGRES_DB=ttmt_dev
      - POSTGRES_USER=ttmt_dev
      - POSTGRES_PASSWORD=ttmt_dev
    ports:
      - "127.0.0.1:5499:5432"
    volumes:
      - ttmt-dev-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ttmt_dev", "-d", "ttmt_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  ttmt-dev-redis:
    image: redis:7-alpine
    container_name: ttmt-dev-redis
    ports:
      - "127.0.0.1:6399:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
